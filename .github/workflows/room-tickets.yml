name: Room tickets checks
on:
  push:
    branches: [codex/dashboard-chamados-salas, codex/mobile-chamados-salas]
  pull_request:
    branches: [main]
    paths:
      - 'Backend/api/sync*.php'
      - 'Backend/api/services/GlpiCollectionReader.php'
      - 'Backend/api/services/AssetService.php'
      - 'Backend/config/asset-catalog.php'
      - 'Backend/tests/test_inventory_sync.php'
      - 'Backend/tests/sandbox.php'
      - 'Frontend/javascript/*sync.js'
      - 'Frontend/javascript/asset_details_ui.js'
      - 'Frontend/javascript/asset_classifier.js'
      - 'Frontend/javascript/glpi.client.js'
      - 'Frontend/test-inventory-sync.cjs'
      - 'Frontend/test-inventory-search-browser.cjs'
      - 'Frontend/javascript/ui_render.js'
      - 'Frontend/javascript/state.js'
      - 'Backend/api/room_tickets.php'
      - 'Backend/api/services/RoomTickets*.php'
      - 'Backend/api/services/RoomTicketWorkStore.php'
      - 'Backend/api/client.php'
      - 'Backend/api/endpoints.php'
      - 'Backend/tests/test_room_tickets.php'
      - 'Backend/tests/test_room_tickets_endpoint.php'
      - 'Backend/tests/test_room_tickets_kanban.php'
      - 'Backend/tests/accept_subprocess.php'
      - 'Backend/tests/test_room_ticket_acknowledgements.php'
      - 'Frontend/javascript/room-tickets.js'
      - 'Frontend/javascript/room-tickets-monitor.js'
      - 'Frontend/javascript/room-tickets-kanban.js'
      - 'Frontend/javascript/room-tickets-list.js'
      - 'Frontend/javascript/room-tickets-tv.js'
      - 'Frontend/javascript/api-client.js'
      - 'Frontend/javascript/dashboard.js'
      - 'Frontend/javascript/app.js'
      - 'Frontend/javascript/sidebar.js'
      - 'Frontend/javascript/permissions.js'
      - 'Frontend/css/room-tickets.css'
      - 'Frontend/css/sidebar.css'
      - 'Frontend/css/search.css'
      - 'Frontend/css/styles.css'
      - 'Frontend/css/room-tickets-tv.css'
      - 'Frontend/index.html'
      - 'Frontend/test-room-tickets.cjs'
      - 'Frontend/test-api-client-errors.cjs'
      - 'Frontend/test-glpi-empty-collections.cjs'
      - 'Frontend/test-room-tickets-browser.cjs'
      - 'Frontend/test-room-tickets-kanban-browser.cjs'
      - 'Frontend/test-room-tickets-tv-browser.cjs'
      - 'Frontend/test-room-tickets-blackbox.cjs'
      - 'Frontend/test-room-tickets-blackbox-boot.js'
      - 'Frontend/test-room-tickets-mobile.cjs'
      - 'Frontend/test-room-tickets-mobile-boot.js'
      - '.github/workflows/room-tickets.yml'
permissions:
  contents: read
concurrency:
  group: room-tickets-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: PHP syntax
        run: |
          php -v
          php -l Backend/tests/test_classifier.php
          php -l Backend/tests/test_sprint2_services.php
          php -l Backend/tests/test_sprint4_execution.php
          php -l Backend/api/sync.php
          php -l Backend/api/sync_status.php
          php -l Backend/api/services/GlpiCollectionReader.php
          php -l Backend/api/services/AssetService.php
          php -l Backend/api/room_tickets.php
          php -l Backend/api/services/RoomTicketsService.php
          php -l Backend/api/services/RoomTicketsReader.php
          php -l Backend/api/services/RoomTicketAcknowledgementStore.php
          php -l Backend/api/services/RoomTicketWorkStore.php
          php -l Backend/api/services/RoomTicketsGlpi.php
          php -l Backend/api/client.php
          php -l Backend/api/endpoints.php
          php -l Backend/scripts/sync-cron.php
      - name: Room aggregation and pagination tests (no network or credentials)
        run: |
          php Backend/tests/test_room_tickets.php
          php Backend/tests/test_room_tickets_kanban.php
          php Backend/tests/test_room_tickets_endpoint.php
          php Backend/tests/test_room_ticket_acknowledgements.php
      - name: Inventory regression tests (isolated data, no network)
        run: |
          php Backend/tests/test_inventory_sync.php
          node --test Frontend/test-inventory-sync.cjs
      - name: JavaScript syntax
        run: |
          node --check Frontend/javascript/room-tickets.js
          node --check Frontend/javascript/room-tickets-monitor.js
          node --check Frontend/javascript/room-tickets-kanban.js
          node --check Frontend/javascript/room-tickets-list.js
          node --check Frontend/javascript/room-tickets-tv.js
          node --check Frontend/javascript/api-client.js
          node --check Frontend/test-room-tickets-blackbox-boot.js
          node --check Frontend/test-room-tickets-mobile-boot.js
          node --check Frontend/test-room-tickets-mobile.cjs
          node --check Frontend/javascript/dashboard.js
          node --check Frontend/javascript/app.js
          node --check Frontend/javascript/ui_render.js
          node --check Frontend/javascript/asset_details_ui.js
          node --check Frontend/javascript/admin_sync.js
          node --check Frontend/javascript/asset_classifier.js
          node --check Frontend/javascript/glpi.client.js
          node --check Frontend/javascript/sidebar.js
          node --check Frontend/javascript/permissions.js
      - name: UI behavior with simulated DOM and API
        run: |
          node --test Frontend/test-room-tickets.cjs
          node --test Frontend/test-api-client-errors.cjs
          node Frontend/test-glpi-empty-collections.cjs
      - name: Browser smoke test (isolated data, desktop and narrow screen)
        run: |
          node Frontend/test-room-tickets-browser.cjs
          node Frontend/test-room-tickets-kanban-browser.cjs
          node Frontend/test-room-tickets-tv-browser.cjs
          node Frontend/test-inventory-search-browser.cjs
      # Caixa preta: módulos REAIS, TODOS os CSS do index.html na ordem de
      # produção e respostas HTTP controladas (409 e 502 reais). A primeira
      # rodada da revisão independente não reproduzia o defeito de
      # centralização justamente porque carregava só o CSS do módulo.
      - name: Black box with real modules, full CSS and controlled HTTP
        run: node Frontend/test-room-tickets-blackbox.cjs
      # Mobile: viewport REAL de 360, 390, 430 e 768 px, carregada dentro de um
      # iframe porque o Chrome do runner recusa janelas com menos de 500 px.
      # Módulos e CSS de produção; a API responde com status HTTP verdadeiros.
      - name: Mobile experience at real narrow viewports
        run: node Frontend/test-room-tickets-mobile.cjs
