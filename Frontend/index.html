<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GLPI Control Center</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/design-system.css" />
  <link rel="stylesheet" href="css/search.css" />
  <link rel="stylesheet" href="css/workflow.css" />
  <link rel="stylesheet" href="css/portal-viewer.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/reports.css" />
  <link rel="stylesheet" href="css/projectors.css" />
  <link rel="stylesheet" href="css/audit.css" />
  <link rel="stylesheet" href="css/notifications.css" />

<link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <!-- LOGIN -->
  <div id="login-screen">
    <div class="login-card">
      <div class="login-logo-area">
        <span class="login-logo-icon">🖥️</span>
      </div>
      <h2>GLPI Control Center</h2>
      <p>Entre com sua conta Google institucional</p>

      <div id="google-btn-container"></div>

      <p class="login-hint">@colegiosatelite.com.br</p>

      <p class="login-error" id="login-error" style="display:none;"></p>
    </div>
  </div>

  <!-- APP -->
  <div id="app">
    <div class="topbar">
      <a class="topbar-logo" href="#">
        <span>🖥️</span>
        GLPI Control Center
      </a>

      <div class="topbar-right">
        <span id="glpi-status" class="glpi-status" style="font-size:13px;color:var(--green)">
          ● Conectado ao GLPI
        </span>
        <div class="notif-bell-wrapper">
          <button class="notif-bell-btn" id="notification-bell-btn" data-notif-action="toggle" title="Central de Notificações">
            🔔
          </button>
          <span class="notif-badge" id="notification-badge" style="display:none;"></span>
        </div>
        <div class="user-info">
          <span id="user-name" class="user-name"></span>
          <span id="user-role" class="user-role"></span>
        </div>
        <div class="avatar" id="user-avatar">U</div>
        <button class="logout-btn" id="logout-btn" onclick="window.App.logout()">Sair</button>
      </div>
    </div>

    <div class="tabs-bar"  id="tabs-bar"></div>
    <div class="content"   id="main-content"></div>
  </div>

  <!-- CENTRAL DE NOTIFICAÇÕES -->
  <div id="notifications-panel"></div>

  <div id="computer-details-modal" class="computer-modal" style="display:none;">
    <div class="computer-modal-backdrop" data-computer-modal-close="backdrop"></div>
    <div class="computer-modal-dialog">
      <div id="computer-details-modal-content"></div>
    </div>
  </div>

  <!-- SCRIPTS (ordem importa) -->
<script src="javascript/config.env.js"></script>
<script src="javascript/theme.js"></script>
<script src="javascript/data.js"></script>
<script src="javascript/state.js"></script>
<script src="javascript/auth.config.js"></script>
<script src="javascript/permissions.js"></script>
<script src="javascript/user_context.js"></script>
<script src="javascript/auth_guard.js"></script>
<script src="javascript/auth.js"></script>
<script src="javascript/glpi.client.js"></script>
<script src="javascript/ui_render.js"></script>
<script src="javascript/workflow.config.js"></script>
<script src="javascript/assistance_flows.js"></script>
<script src="javascript/integrations.config.js"></script>
<script src="javascript/integration-engine.js"></script>
<script src="javascript/integration-audit.js"></script>
<script src="javascript/portal-viewer.utils.js"></script>
<script src="javascript/portal-viewer.js"></script>
<script src="javascript/workflow.js"></script>
<script src="javascript/workflow_ui.js"></script>
<script src="javascript/tickets.js"></script>
<script src="javascript/chat.js"></script>
<script src="javascript/dashboard.config.js"></script>
<script src="javascript/dashboard.js"></script>
<script src="javascript/dashboard_analytics.js"></script>
<script src="javascript/dashboard_charts.js"></script>
<script src="javascript/dashboard_ui.js"></script>
<script src="javascript/reports.config.js"></script>
<script src="javascript/reports.js"></script>
<script src="javascript/report_export.js"></script>
<script src="javascript/reports_ui.js"></script>
<script src="javascript/projectors.config.js"></script>
<script src="javascript/projectors.js"></script>
<script src="javascript/projectors_maintenance.js"></script>
<script src="javascript/projectors_ui.js"></script>
<script src="javascript/audit.config.js"></script>
<script src="javascript/audit_storage.js"></script>
<script src="javascript/audit.js"></script>
<script src="javascript/audit_ui.js"></script>
<script src="javascript/notifications.config.js"></script>
<script src="javascript/notifications_events.js"></script>
<script src="javascript/notifications_storage.js"></script>
<script src="javascript/notifications_templates.js"></script>
<script src="javascript/notifications.js"></script>
<script src="javascript/notifications_center.js"></script>
<script src="javascript/notifications_ui.js"></script>
<script src="javascript/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<!-- MODAL DE CHAMADO -->
<div id="ticket-modal" class="ticket-modal-overlay">
  <div class="ticket-modal-content">
    <h3 class="ticket-modal-title">🎫 Abrir chamado</h3>
    <p id="modal-asset-name" class="ticket-modal-asset"></p>

    <input id="ticket-title" class="ticket-input" placeholder="Título do chamado" />
    <textarea id="ticket-desc" class="ticket-textarea" placeholder="Descrição detalhada"></textarea>

    <select id="ticket-priority" class="ticket-select">
      <option value="1">▽ Muito baixa</option>
      <option value="2">▽ Baixa</option>
      <option value="3" selected>— Média</option>
      <option value="4">△ Alta</option>
      <option value="5">△△ Muito alta</option>
    </select>

    <input id="ticket-category" class="ticket-input" type="number" placeholder="ID da categoria (opcional)" style="margin-bottom:20px;" />

    <div class="ticket-actions">
      <button onclick="window.Tickets.send()" class="ticket-btn-save">
        Salvar no GLPI
      </button>
      <button onclick="window.Tickets.closeModal()" class="ticket-btn-cancel">
        Cancelar
      </button>
    </div>

    <p id="ticket-feedback" class="ticket-feedback"></p>
  </div>
</div>

<!-- MODAL / PAINEL DO CHAT -->
<div id="chat-panel" class="chat-panel-overlay">
  <div class="chat-panel">

    <!-- Header -->
    <div class="chat-header">
      <div>
        <p class="chat-header-title">🤖 Assistente de Horários</p>
        <p class="chat-header-subtitle">Carrinhos de Chromebooks — Colégio Satélite</p>
      </div>
      <button onclick="window.Chat.closePanel()" class="chat-close-btn">✕</button>
    </div>

    <!-- Mensagens -->
    <div id="chat-messages" class="chat-messages">
      <div class="chat-welcome">
        Olá! Pergunte sobre os horários dos carrinhos de Chromebooks. 👋
      </div>
    </div>

    <!-- Input -->
    <div class="chat-input-bar">
      <input
        id="chat-input"
        class="chat-input"
        type="text"
        placeholder="Ex: Qual carrinho usa o 6º ano A?"
        onkeydown="if(event.key==='Enter') window.Chat.send()"
      />
      <button
        onclick="window.Chat.send()"
        class="chat-send-btn">
        Enviar
      </button>
    </div>

  </div>
</div>
</body>
</html>
