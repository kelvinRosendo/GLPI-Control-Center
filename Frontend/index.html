<body>
  <!-- LOGIN -->
  <div id="login-screen">
    <div class="login-card">
      <div class="login-logo-area">
        <img src="assets/branding/logo/logotextoesquerdabranco.png" alt="Colégio Satélite" class="login-logo-img" />
      </div>
      <h2 class="login-title">GLPI Control Center</h2>
      <p class="login-subtitle">Central Operacional de Tecnologia</p>

      <div id="google-btn-container"></div>

      <p class="login-hint">@colegiosatelite.com.br</p>

      <div class="login-mano-isa">
        <span class="mano-isa-text">Mano Isa</span>
      </div>

      <p class="login-error" id="login-error" style="display:none;"></p>
    </div>
  </div>

  <!-- APP -->
  <div id="app" class="app-layout app--sidebar-expanded">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar" role="complementary"></aside>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Conteúdo principal -->
    <div class="app-main">
      <div class="topbar">
        <button class="topbar-menu-btn" id="sidebar-mobile-toggle" aria-label="Abrir menu">
          <span class="gcc-icon gcc-icon--lg"><img src="css/Icons/dashboard.svg" alt="" /></span>
        </button>
        <div class="topbar-left">
          <span id="glpi-status" class="glpi-status">
            <span class="glpi-status-dot"></span>
            <span class="glpi-status-text">Conectado ao GLPI</span>
          </span>
        </div>
        <div class="topbar-right">
          <div class="notif-bell-wrapper">
            <button class="notif-bell-btn" id="notification-bell-btn" data-notif-action="toggle" title="Central de Notificações">
              <span class="gcc-icon gcc-icon--md"><img src="css/Icons/notifications.svg" alt="" /></span>
            </button>
            <span class="notif-badge" id="notification-badge" style="display:none;"></span>
          </div>
          <div class="user-info">
            <span id="user-name" class="user-name"></span>
            <span id="user-role" class="user-role"></span>
          </div>
          <div class="avatar" id="user-avatar">U</div>
          <button class="logout-btn" id="logout-btn" onclick="window.App.logout()">
            <span class="gcc-icon gcc-icon--sm"><img src="css/Icons/logout.svg" alt="" /></span>
          </button>
        </div>
      </div>

      <!-- Breadcrumb -->
      <div id="breadcrumb-container"></div>

      <!-- Conteúdo -->
      <div class="content" id="main-content"></div>
    </div>
  </div>

  <!-- CENTRAL DE NOTIFICAÇÕES -->
  <div id="notifications-panel"></div>

  <div id="computer-details-modal" class="computer-modal" style="display:none;">
    <div class="computer-modal-backdrop" data-computer-modal-close="backdrop"></div>
    <div class="computer-modal-dialog">
      <div id="computer-details-modal-content"></div>
    </div>
  </div>

<!-- MODAL DE CHAMADO -->
<div id="ticket-modal" class="ticket-modal-overlay">
  <div class="ticket-modal-content">
    <h3 class="ticket-modal-title">Abrir chamado</h3>
    <p id="modal-asset-name" class="ticket-modal-asset"></p>

    <input id="ticket-title" class="ticket-input" placeholder="Título do chamado" />
    <textarea id="ticket-desc" class="ticket-textarea" placeholder="Descrição detalhada"></textarea>

    <select id="ticket-priority" class="ticket-select">
      <option value="1">▽ Muito baixa</option>
      <option value="2">▽ Baixa</option>
      <option value="3" selected>— Média</option>
      <option value="4">△ Alta</option>
      <option value="5">△△ Muito alta</option>
    </select>

    <input id="ticket-category" class="ticket-input" type="number" placeholder="ID da categoria (opcional)" style="margin-bottom:20px;" />

    <div class="ticket-actions">
      <button onclick="window.Tickets.send()" class="ticket-btn-save">
        Salvar no GLPI
      </button>
      <button onclick="window.Tickets.closeModal()" class="ticket-btn-cancel">
        Cancelar
      </button>
    </div>

    <p id="ticket-feedback" class="ticket-feedback"></p>
  </div>
</div>

<!-- MODAL / PAINEL DO CHAT -->
<div id="chat-panel" class="chat-panel-overlay">
  <div class="chat-panel">

    <!-- Header -->
    <div class="chat-header">
      <div>
        <p class="chat-header-title">Assistente de Horários</p>
        <p class="chat-header-subtitle">Carrinhos de Chromebooks — Colégio Satélite</p>
      </div>
      <button onclick="window.Chat.closePanel()" class="chat-close-btn">✕</button>
    </div>

    <!-- Mensagens -->
    <div id="chat-messages" class="chat-messages">
      <div class="chat-welcome">
        Olá! Pergunte sobre os horários dos carrinhos de Chromebooks.
      </div>
    </div>

    <!-- Input -->
    <div class="chat-input-bar">
      <input
        id="chat-input"
        class="chat-input"
        type="text"
        placeholder="Ex: Qual carrinho usa o 6º ano A?"
        onkeydown="if(event.key==='Enter') window.Chat.send()"
      />
      <button
        onclick="window.Chat.send()"
        class="chat-send-btn">
        Enviar
      </button>
    </div>

  </div>
</div>
